<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DOOM STYLE - Inicio</title>
        <link rel="shortcut icon" href="./assets/icon/letra-d.ico" type="image/x-icon">
        <link rel="stylesheet" href="css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    </head>
    <body>
        
        <header class="header">
            <div class="header__logo-container">
                <a href="./index.html" class="header__logo-link" aria-label="Ir a la página de inicio de DOOM STYLE">
                    <h1 class="header__titulo">DOOM STYLE</h1>
                </a>
            </div>
            
            <button class="nav-toggle" aria-controls="main-navigation" aria-expanded="false" aria-label="Abrir menú de navegación">
                <span class="nav-toggle__icon"></span>
            </button>
            
            <nav class="nav" id="main-navigation">
                <ul class="nav__lista">
                    <li class="nav__item"><a href="./index.html" class="nav__link nav__link--active" aria-current="page">Inicio</a></li>
                    <li class="nav__item"><a href="./page/seccion_buzos.html" class="nav__link">Buzos</a></li>
                    <li class="nav__item"><a href="./page/seccion_pantalones.html" class="nav__link">Pantalones</a></li>
                    <li class="nav__item"><a href="./page/seccion_remeras.html" class="nav__link">Remeras</a></li>
                </ul>
            </nav>
        </header>

        <main class="main">
            
            <section class="introduccion">
                <div class="introduccion__contenido">
                    
                    <p class="introduccion__texto">
                        ¡Bienvenidos a nuestra página oficial!
                    </p>
                    
                    <figure class="introduccion__imagen-container">
                        <img src="assets/images/horizontal1.avif" alt="Ropa moderna en maniquí" class="introduccion__imagen" loading="lazy">
                    </figure>
                    
                    <p class="introduccion__texto">
                        ¡Ropa cómoda y de calidad para vos!
                    </p>
                    
                    <figure class="introduccion__imagen-container"> 
                        <img src="./assets/images/horizontal2.jpg" alt="Persona usando buzo moderno" class="introduccion__imagen" loading="lazy">
                    </figure>
                    
                    <p class="introduccion__texto introduccion__texto--resaltado">
                        ¡No te vas a arrepentir!
                    </p>               
                </div>
            </section>
            
            <section class="productos" aria-labelledby="productos-heading">
                <h2 class="productos__titulo" id="productos-heading">NUESTROS PRODUCTOS</h2>
                
                <div class="productos__galeria">
                    
                    <article class="producto-card">
                        <a href="./page/seccion_buzos.html" class="producto-card__enlace" aria-label="Ir a la Sección Buzos">
                            <figure class="producto-card__figura">
                                <img src="./assets/images/buzo.jpg" alt="Buzos en exhibición" class="producto-card__imagen" loading="lazy">
                                <figcaption class="producto-card__texto">Sección Buzos</figcaption>
                            </figure>
                        </a>
                    </article>
                    
                    <article class="producto-card">
                        <a href="./page/seccion_pantalones.html" class="producto-card__enlace" aria-label="Ir a la Sección Pantalones">
                            <figure class="producto-card__figura">
                                <img src="./assets/images/pantalón.jpg" alt="Pantalones en exhibición" class="producto-card__imagen" loading="lazy">
                                <figcaption class="producto-card__texto">Sección Pantalones</figcaption>
                            </figure>
                        </a>
                    </article>
                    
                    <article class="producto-card">
                        <a href="./page/seccion_remeras.html" class="producto-card__enlace" aria-label="Ir a la Sección Remeras">
                             <figure class="producto-card__figura">
                                <img src="./assets/images/remera.jpg" alt="Remeras en exhibición" class="producto-card__imagen" loading="lazy">
                                <figcaption class="producto-card__texto">Sección Remeras</figcaption>
                            </figure>
                        </a>
                    </article>
                    
                </div> 
            </section>
                
        </main>
        
        <footer class="footer">
            <p class="footer__texto">© 2025 DOOM STYLE. Todos los derechos reservados.</p>
            
            <nav class="footer__redes" aria-label="Redes Sociales">
                <a href="#" class="footer__link" target="_blank" rel="noopener noreferrer">Instagram</a> 
                <span aria-hidden="true">|</span> 
                <a href="#" class="footer__link" target="_blank" rel="noopener noreferrer">Facebook</a>
            </nav>
        </footer>

    </body>
</html>
